name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.22.x'
          - os: macos-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Run tests
        run: go test -race ./...

      - name: TUI PTY smoke
        run: |
          go build -o heron-test ./cmd/heron
          python3 scripts/tui_smoke.py
          python3 scripts/app_smoke.py
          python3 scripts/ui_smoke.py
          python3 scripts/service_smoke.py
          python3 scripts/service_native_smoke.py

      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd/heron internal/background internal/supervisor/service.go internal/supervisor/inspection*.go internal/process/tracker*.go internal/observe internal/tui)"

      - name: Run vet
        run: go vet ./...

  goreleaser-snapshot:
    name: Build GoReleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
